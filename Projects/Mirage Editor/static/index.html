<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Mirage Editor</title>
  <link rel="stylesheet" href="styles/main.css" />
  <link rel="stylesheet" href="styles/workspace.css" />
  <link rel="stylesheet" href="styles/modals.css" />

  <!-- 🟢 KaTeX (Instant, Synchronous, Non-Flickering Math Engine) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

  <!-- MathJax v3 Fallback Engine -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'],
      },
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div id="sidebar-header">
        <button id="open-vault-btn">Open Vault…</button>
      </div>
      <div id="file-tree"></div>
    </aside>

    <main id="workspace-root"></main>
  </div>
  <script src="../dist/renderer.bundle.js"></script>
</body>
</html>
